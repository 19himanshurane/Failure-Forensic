server {
    listen 80;
    server_name _;

    # Same /api convention as vite.config.js's dev proxy, so the app's own
    # fetch calls never need to know whether they're talking to the Vite dev
    # server or this container.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
