[project]
name = "failure-forensics"
version = "0.1.0"
description = "Observability and root-cause analysis for multi-step AI pipelines"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forensics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
