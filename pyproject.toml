[project]
name = "failure-forensics"
version = "0.1.0"
description = "Observability and root-cause analysis for multi-step AI pipelines"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
otlp = ["opentelemetry-exporter-otlp-proto-grpc>=1.27"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forensics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
